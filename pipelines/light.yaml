# Light Pipeline — first contact / only business wish available

name: light
description: Quick first-pass when we only have the initial request from the client

stages:
  - name: intake-and-frame
    agent: technical-product-manager
    required: true

  - name: research
    agent: product-researcher
    depends_on: [intake-and-frame]

  - name: shape-and-spec
    agent: technical-product-manager
    depends_on: [research]

  - name: review
    agent: adversarial-reviewer
    depends_on: [shape-and-spec]
    human_gate: true

  - name: finalize
    agent: technical-product-manager
    depends_on: [review]
    always_run: true
