# Support-driven Pipeline
# Starts from user pain visible in support tickets / complaints.

name: support-driven
description: From support pain and usage signals to targeted product improvements

stages:
  - name: intake
    agent: technical-product-manager
    required: true

  - name: discovery-gate
    agent: technical-product-manager
    depends_on: [intake]
    human_gate: true

  - name: understand-system
    agent: system-domain-analyst
    depends_on: [discovery-gate]

  - name: research
    agent: product-researcher
    depends_on: [understand-system]

  - name: shape-and-spec
    agent: technical-product-manager
    depends_on: [research]

  - name: review
    agent: adversarial-reviewer
    depends_on: [shape-and-spec]
    human_gate: true

  - name: finalize
    agent: technical-product-manager
    depends_on: [review]
    always_run: true
