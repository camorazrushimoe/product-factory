# Full Discovery Pipeline
# Used when we have (or will get) access to code, data, and people.

name: full-discovery
description: Deep product discovery leading to engineering-ready Product Spec

stages:
  - name: intake
    agent: technical-product-manager
    required: true

  - name: discovery-gate
    agent: technical-product-manager
    depends_on: [intake]
    human_gate: true

  - name: understand-system
    agent: system-domain-analyst
    depends_on: [intake]

  - name: research
    agent: product-researcher
    depends_on: [understand-system]
    human_gate: true          # after meetings / human input

  - name: shape-and-spec
    agent: technical-product-manager
    depends_on: [research, understand-system]

  - name: review
    agent: adversarial-reviewer
    depends_on: [shape-and-spec]
    human_gate: true

  - name: finalize
    agent: technical-product-manager
    depends_on: [review]
    always_run: true
