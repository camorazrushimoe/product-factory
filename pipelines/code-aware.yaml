# Code-aware Pipeline
# Used when we have access to source code.

name: code-aware
description: Intake + system understanding → product direction

stages:
  - name: intake
    agent: technical-product-manager
    required: true

  - name: understand-system
    agent: system-domain-analyst
    depends_on: [intake]

  - name: research
    agent: product-researcher
    depends_on: [understand-system]

  - name: shape-and-spec
    agent: technical-product-manager
    depends_on: [research, understand-system]

  - name: review
    agent: adversarial-reviewer
    depends_on: [shape-and-spec]
    human_gate: true

  - name: finalize
    agent: technical-product-manager
    depends_on: [review]
    always_run: true
