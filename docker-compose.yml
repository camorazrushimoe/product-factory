# Product Factory — initial skeleton
# Modeled after camorazrushimoe/dev-crew

services:
  shared-memory:
    image: redis:7-alpine
    container_name: product-factory-shared-memory
    networks: [crew]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

