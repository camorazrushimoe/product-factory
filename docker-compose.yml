name: ${TEAM_NAME:-product-factory}

# Product Factory — Office-attached mode (DEFAULT).
#
# Spec team: turns validated research (or raw business intake) into Product
# Specs ready for engineering. Artifacts are documents (specs, LLM Wiki,
# workspace drafts), not running systems — so no private dev-cluster.
#
# Agents join the Agent Office shared bus (external network agent-office-crew);
# no local Redis. Containers are lifecycle-controller-managed (restart: "no").
#
# Env (from .env — see .env.example):
#   TEAM_NAME         instance id (default: product-factory)
#   OFFICE_BUS_URL    Office Redis (default: redis://shared-memory:6379)
#   CUSTOM_API_KEY    LLM key (runinfra)
#   DOOR_SECRET_*     per-agent door HMAC secrets
#   SPEC_PORT_*       host port overrides (defaults 8651–8654)
#
# Doors: POST /webhooks/inbox on 8644 in-container, host-mapped below.
# Each agent renders its config.yaml from config.yaml.template at start.

services:
  technical-product-manager:
    image: nousresearch/hermes-agent:latest
    container_name: ${TEAM_NAME:-product-factory}-technical-product-manager
    restart: "no"
    networks: [office]
    volumes:
      - ./agents/technical-product-manager/hermes-home:/opt/data
      - ./agents/technical-product-manager/skills:/opt/data/skills/product-factory:ro
      - ./crew:/opt/crew:ro
      - ./workspace:/workspace
      - ./knowledge:/knowledge
    environment:
      - HERMES_UID=${HERMES_UID:-501}
      - HERMES_GID=${HERMES_GID:-20}
      - HERMES_WRITE_SAFE_ROOT=/opt/data:/workspace:/knowledge
      - CUSTOM_API_KEY=${CUSTOM_API_KEY:-}
      - DOOR_SECRET=${DOOR_SECRET_TECHNICAL_PRODUCT_MANAGER:-}
      - OFFICE_BUS_URL=${OFFICE_BUS_URL:-redis://shared-memory:6379}
      - TEAM_NAME=${TEAM_NAME:-product-factory}
    ports:
      - "${SPEC_PORT_TECHNICAL_PRODUCT_MANAGER:-8651}:8644"
    command: ["sh", "-c", "python3 /opt/crew/render_config.py && exec hermes gateway run"]

  product-researcher:
    image: nousresearch/hermes-agent:latest
    container_name: ${TEAM_NAME:-product-factory}-product-researcher
    restart: "no"
    networks: [office]
    volumes:
      - ./agents/product-researcher/hermes-home:/opt/data
      - ./agents/product-researcher/skills:/opt/data/skills/product-factory:ro
      - ./crew:/opt/crew:ro
      - ./workspace:/workspace
    environment:
      - HERMES_UID=${HERMES_UID:-501}
      - HERMES_GID=${HERMES_GID:-20}
      - HERMES_WRITE_SAFE_ROOT=/opt/data:/workspace
      - CUSTOM_API_KEY=${CUSTOM_API_KEY:-}
      - DOOR_SECRET=${DOOR_SECRET_PRODUCT_RESEARCHER:-}
      - OFFICE_BUS_URL=${OFFICE_BUS_URL:-redis://shared-memory:6379}
      - TEAM_NAME=${TEAM_NAME:-product-factory}
    ports:
      - "${SPEC_PORT_PRODUCT_RESEARCHER:-8652}:8644"
    command: ["sh", "-c", "python3 /opt/crew/render_config.py && exec hermes gateway run"]

  system-domain-analyst:
    image: nousresearch/hermes-agent:latest
    container_name: ${TEAM_NAME:-product-factory}-system-domain-analyst
    restart: "no"
    networks: [office]
    volumes:
      - ./agents/system-domain-analyst/hermes-home:/opt/data
      - ./agents/system-domain-analyst/skills:/opt/data/skills/product-factory:ro
      - ./crew:/opt/crew:ro
      - ./workspace:/workspace:ro
      - ./knowledge:/knowledge:ro
    environment:
      - HERMES_UID=${HERMES_UID:-501}
      - HERMES_GID=${HERMES_GID:-20}
      - HERMES_WRITE_SAFE_ROOT=/opt/data:/workspace:/knowledge
      - CUSTOM_API_KEY=${CUSTOM_API_KEY:-}
      - DOOR_SECRET=${DOOR_SECRET_SYSTEM_DOMAIN_ANALYST:-}
      - OFFICE_BUS_URL=${OFFICE_BUS_URL:-redis://shared-memory:6379}
      - TEAM_NAME=${TEAM_NAME:-product-factory}
    ports:
      - "${SPEC_PORT_SYSTEM_DOMAIN_ANALYST:-8653}:8644"
    command: ["sh", "-c", "python3 /opt/crew/render_config.py && exec hermes gateway run"]

  adversarial-reviewer:
    image: nousresearch/hermes-agent:latest
    container_name: ${TEAM_NAME:-product-factory}-adversarial-reviewer
    restart: "no"
    networks: [office]
    volumes:
      - ./agents/adversarial-reviewer/hermes-home:/opt/data
      - ./agents/adversarial-reviewer/skills:/opt/data/skills/product-factory:ro
      - ./crew:/opt/crew:ro
      - ./workspace:/workspace:ro
    environment:
      - HERMES_UID=${HERMES_UID:-501}
      - HERMES_GID=${HERMES_GID:-20}
      - HERMES_WRITE_SAFE_ROOT=/opt/data:/workspace
      - CUSTOM_API_KEY=${CUSTOM_API_KEY:-}
      - DOOR_SECRET=${DOOR_SECRET_ADVERSARIAL_REVIEWER:-}
      - OFFICE_BUS_URL=${OFFICE_BUS_URL:-redis://shared-memory:6379}
      - TEAM_NAME=${TEAM_NAME:-product-factory}
    ports:
      - "${SPEC_PORT_ADVERSARIAL_REVIEWER:-8654}:8644"
    command: ["sh", "-c", "python3 /opt/crew/render_config.py && exec hermes gateway run"]

networks:
  office:
    external: true
    name: agent-office-crew
